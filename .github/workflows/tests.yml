name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      # CPU torch: the suite that runs here needs no GPU and no weights.
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
          pip install "transformers>=5.17,<5.18" safetensors huggingface_hub fastapi uvicorn httpx pytest pillow
          # the MLX backend's converter and small-shape parity tests (mlx's Linux CPU build)
          pip install "mlx[cpu]>=0.32"

      # Everything except the tests that need real weights, which are marked
      # `slow` and run on a machine that has them. tests/ is only what CI runs;
      # diagnostics that need a model live in scripts/.
      - name: Tests
        run: pytest tests/ -q -m "not slow"
